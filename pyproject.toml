[project]
name = "practice-rag"
version = "0.1.0"
description = "HR Policy Assistant using RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "coloredlogs>=15.0.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.6",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "openevals>=0.2.0",
    "portkey-ai>=2.3.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "streamlit>=1.64.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["foundation-basic-rag"]
testpaths = ["foundation-basic-rag/tests"]
